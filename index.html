<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f2"><meta name="apple-mobile-web-app-capable" content="yes"><title>FutariShopping</title><link rel="apple-touch-icon" sizes="180x180" href="./icon.png"><link rel="icon" type="image/png" href="./icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#203957;background:#faf8f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:78px;padding:22px 20px 14px;border-bottom:1px solid #e6e1d7;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0;letter-spacing:.05em}main{max-width:680px;margin:auto;padding:20px 17px 190px}.sub{color:#737985;font-size:13px}.chips{display:flex;gap:9px;overflow:auto;padding:8px 0 16px}.chip{white-space:nowrap;border:1.5px solid #9b9a91;background:white;color:#203957;padding:11px 17px;border-radius:30px}.chip.active{border-color:#203957;background:#203957;color:white}.section{font-size:13px;color:#747984;margin:16px 0 4px}.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e9e5dc;border-radius:14px;margin:9px 0;padding:13px}.item input{width:21px;height:21px;accent-color:#c65430}.item .name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}.done{text-decoration:line-through;opacity:.45}.tiny{font-size:12px;color:#81858c;margin-top:4px}.delete{background:none;border:0;color:#92949a;font-size:20px;padding:6px}.empty{min-height:42vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px}.empty .apple{font-size:60px;color:#203957}.empty strong{font-size:19px}.empty p{font-size:13px;color:#777d87;line-height:1.7;margin:0}.actions{position:fixed;bottom:86px;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:10px 15px;background:linear-gradient(transparent,#faf8f2 25%)}.action{border:2px solid #c65430;background:white;color:#c65430;border-radius:50px;padding:15px 18px;font-weight:700}.action.primary{background:#c65430;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4ddd2;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#78808b;padding:11px 3px 15px;font-size:12px}.nav button.active{color:#203957;font-weight:700}.nav .symbol{display:block;font-size:24px;margin-bottom:4px}.panel{background:#fff;border:1px solid #e8e1d7;border-radius:16px;padding:16px;margin-top:14px}.field{width:100%;border:1.5px solid #c7c5c0;border-radius:13px;padding:14px;margin:9px 0;color:#203957;background:white}.wide{width:100%;background:#c65430;color:#fff;border:0;border-radius:15px;padding:15px;font-weight:700;margin-top:9px}.outline{background:white;color:#203957;border:1px solid #9a9a91;border-radius:13px;padding:10px 14px}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1;min-width:0}.notice{padding:11px;background:#fff0e9;border-radius:10px;color:#8b482f;font-size:13px;margin:12px 0}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:100%;max-width:680px;max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 15px}.hidden{display:none!important}.pill{display:inline-block;background:#f8e8e2;padding:6px 12px;border-radius:20px;font-size:12px}.shopline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.shopline span{flex:1}#status{font-size:12px;color:#8b654b;min-height:16px}button:disabled{opacity:.45}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar select{width:auto;max-width:100%;padding:10px}.mini{font-size:12px;padding:9px 12px}.danger{color:#b34d35}.muted{color:#747984}.badge{border-radius:15px;background:#f8e8e2;padding:4px 9px;font-size:12px}.item.dragging{opacity:.45}.item button{flex-shrink:0}.item .name{min-width:0}.stack{display:grid;gap:10px}.stack .field{margin:0}.wrap{overflow-wrap:anywhere}.actions{bottom:75px}.nav button{font-size:11px}.panel h3{margin-top:0}
</style></head><body><header><h1 id="heading">買い物リスト</h1><span id="status">接続中…</span></header><main><div id="content"></div></main><div class="actions" id="actions"><button class="action" id="voiceBtn">🎙 話して追加</button><button class="action primary" id="addBtn">✎ 入力して追加</button></div><nav class="nav"><button data-tab="regular"><span class="symbol">⇄</span>定期購入品</button><button data-tab="list" class="active"><span class="symbol">▤</span>買い物リスト</button><button data-tab="profile"><span class="symbol">♙</span>マイページ</button></nav><div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,signInAnonymously,onAuthStateChanged,EmailAuthProvider,linkWithCredential,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,collection,addDoc,doc,setDoc,getDoc,getDocs,updateDoc,deleteDoc,onSnapshot,serverTimestamp,writeBatch}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyC2hJ4XrL80cW44Fe1Af5PiccARExSmm1c',authDomain:'futarishopping.firebaseapp.com',projectId:'futarishopping',storageBucket:'futarishopping.firebasestorage.app',messagingSenderId:'853354194520',appId:'1:853354194520:web:aa0e48c226a05e21dd4c2d'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=['Amazon','スーパー','薬局','コーナン'];
let uid=null,tab='list',selected='すべて',sortMode='manual',shopping=false,shops=[],items=[],history=[],houseId=null,house=null,requests=[],members=[],unsubs=[],busy=false,ready=false,requestsWatching=false;
const msg=s=>{$('status').textContent=s};const ownItems=()=>collection(db,'users',uid,'items'),ownShops=()=>collection(db,'users',uid,'shops');
const itemsRef=()=>houseId?collection(db,'households',houseId,'items'):ownItems();const shopsRef=()=>houseId?collection(db,'households',houseId,'shops'):ownShops();const histRef=()=>collection(db,'households',houseId,'history');
const clean=()=>{unsubs.forEach(f=>f());unsubs=[]};const watch=(r,cb)=>unsubs.push(onSnapshot(r,cb,e=>msg('同期エラー：'+e.code)));
const close=()=>{$('modal').classList.add('hidden')};const open=s=>{$('sheet').innerHTML=s;$('modal').classList.remove('hidden')};
const stamp=x=>x?.toDate?.()|| (x?.seconds?new Date(x.seconds*1000):null);
const dateText=x=>{let d=stamp(x);return d?d.toLocaleDateString('ja-JP'):'未記録'};
const remain=x=>{let d=stamp(x.lastPurchasedAt)||stamp(x.createdAt);if(!d||!x.cycle)return '周期未設定';let next=new Date(d);next.setDate(next.getDate()+Number(x.cycle));let n=Math.ceil((next-new Date())/86400000);return n<0?`${Math.abs(n)}日超過`:n===0?'今日が購入予定日':`あと${n}日`};
const uniqueShops=()=>[...new Set([...defaults,...shops.map(s=>s.name)])];
function sorted(list){let a=[...list];if(sortMode==='shop')a.sort((x,y)=>String(x.shop).localeCompare(String(y.shop),'ja')||String(x.name).localeCompare(String(y.name),'ja'));else if(sortMode==='new')a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));else a.sort((x,y)=>(x.order??(x.createdAt?.seconds||0)*1000)-(y.order??(y.createdAt?.seconds||0)*1000));return shopping?a.sort((x,y)=>Number(x.done)-Number(y.done)):a}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('heading').textContent={list:'買い物リスト',regular:'定期購入品',profile:'マイページ'}[tab];$('actions').classList.toggle('hidden',tab!=='list'||!uid);if(!uid){$('content').innerHTML='<div class="panel">接続中…</div>';return}if(tab==='profile')return profile();if(tab==='regular')return regularView();return listView()}
function regularView(){let a=sorted(items.filter(x=>x.regular));$('content').innerHTML=`<p class="sub">購入日を記録すると、次の購入予定日を計算します。未記録の商品は登録日を仮の起点にします。</p><button class="wide" id="addRegular">＋ 定期購入品を登録</button>${a.map(x=>`<div class="item"><div class="name">${esc(x.name)}<div class="tiny">${esc(x.shop||'未設定')} · ${x.cycle?esc(x.cycle)+'日周期':'周期未設定'}</div><div class="tiny">${esc(remain(x))} · 最終購入 ${dateText(x.lastPurchasedAt)}</div></div><button class="outline mini" data-to-list="${x.id}">リストへ</button><button class="outline mini" data-bought="${x.id}">購入済</button><button class="delete" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty">定期購入品はまだありません</div>'}`;$('addRegular').onclick=()=>addModal(true);bindItems()}
function listView(){let a=sorted(items.filter(x=>!x.regular&&(selected==='すべて'||x.shop===selected)));$('content').innerHTML=`<div class="section">${houseId?'🏠 共有中':'📱 個人データ'}</div><div class="chips">${['すべて',...uniqueShops()].map(s=>`<button class="chip ${selected===s?'active':''}" data-filter="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="toolbar"><select class="field" id="sortMode"><option value="manual">手動順</option><option value="shop">購入先順</option><option value="new">新しい順</option></select><button class="outline mini" id="shoppingMode">${shopping?'買い物モード ON':'買い物モード OFF'}</button><button class="outline mini" id="historyBtn">購入履歴</button></div><p class="sub">未購入 ${a.filter(x=>!x.done).length}件 / 購入済 ${a.filter(x=>x.done).length}件${sortMode==='manual'?' · ↑↓で並び替え':''}</p>${a.map(x=>`<div class="item"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><div class="name ${x.done?'done':''}">${esc(x.name)}<div class="tiny">${esc(x.shop||'未設定')}${x.memo?' · '+esc(x.memo):''}</div></div>${sortMode==='manual'?`<button class="outline mini" data-move="${x.id}" data-dir="-1">↑</button><button class="outline mini" data-move="${x.id}" data-dir="1">↓</button>`:''}<button class="delete" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty"><strong>今回買う物を入れましょう</strong></div>'}<button class="wide" id="finishShopping" ${a.some(x=>x.done)?'':'disabled'}>✓ チェック済みを購入完了・履歴に保存</button>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{selected=b.dataset.filter;render()});$('sortMode').value=sortMode;$('sortMode').onchange=e=>{sortMode=e.target.value;render()};$('shoppingMode').onclick=()=>{shopping=!shopping;render()};$('historyBtn').onclick=historyModal;$('finishShopping').onclick=finishShopping;document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>moveItem(b.dataset.move,Number(b.dataset.dir)));bindItems()}
function bindItems(){document.querySelectorAll('[data-check]').forEach(el=>el.onchange=async()=>{try{await updateDoc(doc(itemsRef(),el.dataset.check),{done:el.checked,updatedAt:serverTimestamp()})}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{if(confirm('この商品を削除しますか？'))try{await deleteDoc(doc(itemsRef(),el.dataset.del))}catch(e){alert(e.message)}});document.querySelectorAll('[data-to-list]').forEach(el=>el.onclick=async()=>{let x=items.find(i=>i.id===el.dataset.toList);if(!x)return;try{await addDoc(itemsRef(),{name:x.name,shop:x.shop||'未設定',memo:'',done:false,regular:false,cycle:null,sourceRegularId:x.id,order:Date.now(),createdAt:serverTimestamp()});tab='list';render()}catch(e){alert(e.message)}});document.querySelectorAll('[data-bought]').forEach(el=>el.onclick=async()=>{if(!confirm('今日購入した日として記録しますか？'))return;try{await updateDoc(doc(itemsRef(),el.dataset.bought),{lastPurchasedAt:serverTimestamp(),updatedAt:serverTimestamp()})}catch(e){alert(e.message)}})}
async function moveItem(id,dir){let a=sorted(items.filter(x=>!x.regular&&(selected==='すべて'||x.shop===selected)));let i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];try{let batch=writeBatch(db);a.forEach((x,k)=>batch.update(doc(itemsRef(),x.id),{order:k+1,updatedAt:serverTimestamp()}));await batch.commit()}catch(e){alert(e.message)}}
async function finishShopping(){let done=items.filter(x=>!x.regular&&x.done);if(!done.length)return;if(!confirm(`${done.length}件を購入履歴に記録してリストから外しますか？`))return;if(!houseId){alert('購入履歴は共有グループ作成後に利用できます。個人データはそのまま残します。');return}try{let batch=writeBatch(db);for(let x of done){let h=doc(histRef());batch.set(h,{name:x.name,shop:x.shop||'未設定',memo:x.memo||'',purchasedAt:serverTimestamp(),sourceRegularId:x.sourceRegularId||'',byUid:uid});batch.delete(doc(itemsRef(),x.id));if(x.sourceRegularId&&items.some(r=>r.id===x.sourceRegularId&&r.regular))batch.update(doc(itemsRef(),x.sourceRegularId),{lastPurchasedAt:serverTimestamp(),updatedAt:serverTimestamp()})}await batch.commit();alert('購入履歴に保存しました')}catch(e){alert('購入完了に失敗：'+e.message)}}
function historyModal(){open(`<div class="row"><h2>購入履歴</h2><button class="outline" id="closeModal">閉じる</button></div>${!houseId?'<p class="notice">履歴保存は共有グループ移行後に有効になります。</p>':''}${history.map(x=>`<div class="item"><div class="name">${esc(x.name)}<div class="tiny">${esc(x.shop)} · ${dateText(x.purchasedAt)}</div></div><button class="outline mini" data-again="${x.id}">再追加</button></div>`).join('')||'<p class="sub">まだ購入履歴がありません</p>'}`);$('closeModal').onclick=close;document.querySelectorAll('[data-again]').forEach(b=>b.onclick=async()=>{let x=history.find(v=>v.id===b.dataset.again);try{await addDoc(itemsRef(),{name:x.name,shop:x.shop||'未設定',memo:x.memo||'',done:false,regular:false,cycle:null,order:Date.now(),createdAt:serverTimestamp()});close();tab='list';render()}catch(e){alert(e.message)}})}
function addModal(regular=false){open(`<div class="row"><h2>${regular?'定期購入品を登録':'入力して追加'}</h2><button class="outline" id="closeModal">閉じる</button></div><label>購入先</label><select class="field" id="newShop">${['未設定',...uniqueShops()].map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="outline" id="shopManage">＋ 購入先を追加</button><label>商品名</label><input class="field" id="newName" maxlength="100" placeholder="例：牛乳"><label>メモ（任意）</label><input class="field" id="newMemo" maxlength="200">${regular?'<label>購入周期（日）</label><input class="field" id="newCycle" type="number" min="1" max="3650" placeholder="例：60">':''}<button class="wide" id="saveItem">追加する</button>`);$('closeModal').onclick=close;$('shopManage').onclick=()=>shopModal(true,regular);$('saveItem').onclick=async()=>{let name=$('newName').value.trim(),shop=$('newShop').value,memo=$('newMemo').value.trim(),cycle=regular?(Number($('newCycle').value)||null):null;if(!name)return alert('商品名を入力してね');if(cycle!==null&&(cycle<1||cycle>3650||!Number.isInteger(cycle)))return alert('周期は1〜3650日の整数にしてね');if(busy)return;busy=true;$('saveItem').disabled=true;try{await addDoc(itemsRef(),{name,shop,memo,done:false,regular,cycle,order:Date.now(),createdAt:serverTimestamp()});close()}catch(e){alert('保存できませんでした：'+e.message)}finally{busy=false}}}
function shopModal(fromAdd=false,regular=false){let names=uniqueShops();open(`<div class="row"><h2>購入先を管理</h2><button class="outline" id="closeModal">閉じる</button></div><div class="row"><input class="field" id="shopInput" maxlength="40" placeholder="例：業務スーパー"><button class="outline" id="saveShop">追加</button></div>${names.map(s=>{let c=shops.find(x=>x.name===s);return `<div class="shopline"><span>${esc(s)}</span>${c?`<button class="outline mini" data-rename="${c.id}">変更</button><button class="delete" data-shop-del="${c.id}">×</button>`:'<span class="badge">初期設定</span>'}</div>`}).join('')}`);$('closeModal').onclick=()=>{close();if(fromAdd)addModal(regular)};$('saveShop').onclick=async()=>{let name=$('shopInput').value.trim();if(!name||names.includes(name))return alert('未入力または登録済みです');try{await addDoc(shopsRef(),{name,createdAt:serverTimestamp()});shopModal(fromAdd,regular)}catch(e){alert(e.message)}};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let s=shops.find(x=>x.id===b.dataset.rename),name=prompt('新しい購入先',s.name)?.trim();if(!name||names.includes(name))return;try{await updateDoc(doc(shopsRef(),s.id),{name});shopModal(fromAdd,regular)}catch(e){alert(e.message)}});document.querySelectorAll('[data-shop-del]').forEach(b=>b.onclick=async()=>{if(!confirm('購入先を削除しますか？'))return;try{await deleteDoc(doc(shopsRef(),b.dataset.shopDel));shopModal(fromAdd,regular)}catch(e){alert(e.message)}})}
function backup(){let obj={format:'FutariShopping-backup-v2',exportedAt:new Date().toISOString(),uid,houseId,shops,items,history};let data=JSON.stringify(obj,(k,v)=>v&&typeof v==='object'&&typeof v.toDate==='function'?{seconds:v.seconds,nanoseconds:v.nanoseconds}:v,2);let url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='FutariShopping-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function profile(){let user=auth.currentUser;let email=user?.email||'';$('content').innerHTML=`<div class="panel"><h3>データ保護</h3><p class="sub">${houseId?'🏠 共有グループで同期中':'📱 個人データで使用中'} · ${email?'メール認証済み':'匿名ログイン'}</p><p class="sub wrap">ユーザーID：${esc(uid)}</p><button class="wide" id="backup">JSONバックアップを保存</button><p class="notice">移行前に必ずバックアップを保存してください。古いホーム画面アイコンやSafariのサイトデータは、移行完了まで削除しないでください。</p></div><div class="panel"><h3>アカウント</h3>${email?`<p class="sub">${esc(email)}</p>`:`<p class="sub">メール・パスワードを紐付けると、同じユーザーIDを維持したまま復旧可能になります。</p><button class="wide" id="linkEmail">メールとパスワードを登録</button>`}<button class="outline" id="loginEmail">既存アカウントでログイン</button></div><div class="panel"><h3>2人で共有</h3>${houseId?`<p>共有グループID：<span class="wrap">${esc(houseId)}</span></p><p class="sub">参加者 ${members.length}人</p><button class="wide" id="invite">招待コードを表示・更新</button>${house?.ownerUid===uid?`<button class="outline" id="approve">参加申請 ${requests.length}件</button>`:''}`:`<p class="sub">共有グループを作成して既存データをコピーするか、招待コードから参加できます。</p><button class="wide" id="createHouse">共有グループを作成・移行</button><button class="outline" id="joinHouse">招待コードで参加申請</button><button class="outline" id="checkMember">共有を確認</button>`}</div><div class="panel"><h3>購入先の管理</h3><button class="wide" id="manageShops">購入先を追加・編集</button></div>`;$('backup').onclick=backup;$('manageShops').onclick=()=>shopModal();$('loginEmail').onclick=loginModal;if($('linkEmail'))$('linkEmail').onclick=linkModal;if($('createHouse'))$('createHouse').onclick=createHouse;if($('joinHouse'))$('joinHouse').onclick=joinModal;if($('checkMember'))$('checkMember').onclick=checkMembership;if($('invite'))$('invite').onclick=inviteModal;if($('approve'))$('approve').onclick=approveModal}
function linkModal(){open(`<h2>アカウントを保護</h2><p class="notice">現在の匿名ユーザーにメールを紐付けます。新規ログインではありません。</p><input class="field" id="email" type="email" placeholder="メールアドレス"><input class="field" id="pass" type="password" placeholder="パスワード（6文字以上）"><button class="wide" id="doLink">登録する</button><button class="outline" id="cancel">閉じる</button>`);$('cancel').onclick=close;$('doLink').onclick=async()=>{try{let cred=EmailAuthProvider.credential($('email').value.trim(),$('pass').value);await linkWithCredential(auth.currentUser,cred);close();render();alert('アカウントを保護しました')}catch(e){alert('登録失敗：'+e.message)}}}
function loginModal(){open(`<h2>既存アカウントでログイン</h2><p class="notice">ログインすると現在の匿名ユーザーから切り替わります。匿名データがある場合は先にバックアップ・メール紐付けしてください。</p><input class="field" id="email" type="email" placeholder="メールアドレス"><input class="field" id="pass" type="password" placeholder="パスワード"><button class="wide" id="doLogin">ログイン</button><button class="outline" id="cancel">閉じる</button>`);$('cancel').onclick=close;$('doLogin').onclick=async()=>{if(!confirm('現在のユーザーからログアウトして切り替えます。バックアップ済みですか？'))return;try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value);close()}catch(e){alert(e.message)}}}
function code(){let b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
async function createHouse(){if(!auth.currentUser?.email)return alert('先にメール・パスワードを登録してください');if(!confirm('最初にJSONバックアップを保存しましたか？\n元データは削除せず、共有グループへコピーします。'))return;let hid=doc(collection(db,'households')).id;try{await setDoc(doc(db,'households',hid),{ownerUid:uid,createdAt:serverTimestamp()});await setDoc(doc(db,'households',hid,'members',uid),{uid,joinedAt:serverTimestamp()});let legacyItems=(await getDocs(ownItems())).docs,legacyShops=(await getDocs(ownShops())).docs;let all=[...legacyItems.map(d=>({ref:doc(db,'households',hid,'items',d.id),data:d.data()})),...legacyShops.map(d=>({ref:doc(db,'households',hid,'shops',d.id),data:d.data()}))];for(let i=0;i<all.length;i+=200){let batch=writeBatch(db);all.slice(i,i+200).forEach(v=>batch.set(v.ref,v.data));await batch.commit()}await setDoc(doc(db,'users',uid,'profile','settings'),{householdId:hid,updatedAt:serverTimestamp()});alert(`共有グループを作成し、商品${legacyItems.length}件・購入先${legacyShops.length}件をコピーしました。元データも残っています。`);await start()}catch(e){alert('移行が完了していません：'+e.message+'\n元データは削除されていません。繰り返し作成せず、状況を確認してください。')}}
async function inviteModal(){if(house?.ownerUid!==uid)return alert('招待コードの発行はオーナーのみです');let c=code();try{await setDoc(doc(db,'invites',c),{householdId:houseId,ownerUid:uid,createdAt:serverTimestamp()});open(`<h2>招待コード</h2><p class="sub">相手にこのコードを渡してください。コードだけでは共有データは見られず、あなたの承認が必要です。</p><div class="panel wrap" id="inviteCode">${c}</div><button class="wide" id="copyCode">コードをコピー</button><button class="outline" id="closeModal">閉じる</button>`);$('copyCode').onclick=()=>navigator.clipboard?.writeText(c).then(()=>alert('コピーしました')).catch(()=>alert('コードを長押ししてコピーしてください'));$('closeModal').onclick=close}catch(e){alert(e.message)}}
function joinModal(){open(`<h2>参加申請</h2><p class="sub">相手から受け取った32文字の招待コードを入力。オーナーが承認すると共有が始まります。</p><input class="field" id="inviteInput" placeholder="招待コード"><button class="wide" id="requestJoin">参加を申請する</button><button class="outline" id="closeModal">閉じる</button>`);$('closeModal').onclick=close;$('requestJoin').onclick=async()=>{if(!auth.currentUser?.email)return alert('先にメール・パスワードを登録してください');let c=$('inviteInput').value.trim().toLowerCase();if(!/^[0-9a-f]{32}$/.test(c))return alert('32文字のコードを入力してください');try{let inv=await getDoc(doc(db,'invites',c));if(!inv.exists())return alert('招待コードが見つかりません');let hid=inv.data().householdId;await setDoc(doc(db,'households',hid,'requests',uid),{uid,inviteCode:c,requestedAt:serverTimestamp()});await setDoc(doc(db,'users',uid,'joinPointers',hid),{requestedAt:serverTimestamp()});close();alert('申請しました。相手にマイページから承認してもらってください。承認後、マイページを開き直してください。')}catch(e){alert('申請できません：'+e.message)}}}
function approveModal(){open(`<h2>参加申請</h2>${requests.map(r=>`<div class="panel"><div class="wrap">${esc(r.uid)}</div><button class="wide" data-approve="${r.uid}">承認する</button></div>`).join('')||'<p>申請はありません</p>'}<button class="outline" id="closeModal">閉じる</button>`);$('closeModal').onclick=close;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{let target=b.dataset.approve;if(!confirm('このユーザーを共有グループに参加させますか？'))return;try{await setDoc(doc(db,'households',houseId,'members',target),{uid:target,joinedAt:serverTimestamp()});await deleteDoc(doc(db,'households',houseId,'requests',target));close();alert('承認しました。相手はマイページの「共有を確認」を押してください。')}catch(e){alert(e.message)}})}
async function checkMembership(){if(houseId)return;try{let reqs=await getDocs(collection(db,'users',uid,'joinPointers'));for(let r of reqs.docs){let hid=r.id,m=await getDoc(doc(db,'households',hid,'members',uid));if(m.exists()){await setDoc(doc(db,'users',uid,'profile','settings'),{householdId:hid,updatedAt:serverTimestamp()});await start();return}}alert('まだ承認されていないか、申請がありません')}catch(e){alert(e.message)}}
async function start(){clean();requestsWatching=false;items=[];shops=[];history=[];requests=[];members=[];house=null;houseId=null;let settings=await getDoc(doc(db,'users',uid,'profile','settings'));let hid=settings.exists()?settings.data().householdId:null;if(hid){let m=await getDoc(doc(db,'households',hid,'members',uid));if(m.exists())houseId=hid}if(houseId){watch(doc(db,'households',houseId),s=>{house=s.data();if(house?.ownerUid===uid&&!requestsWatching){requestsWatching=true;watch(collection(db,'households',houseId,'requests'),r=>{requests=r.docs.map(d=>d.data());render()})}render()});watch(collection(db,'households',houseId,'history'),s=>{history=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.purchasedAt?.seconds||0)-(a.purchasedAt?.seconds||0));render()});watch(collection(db,'households',houseId,'members'),s=>{members=s.docs.map(d=>d.data());render()});}watch(shopsRef(),s=>{shops=s.docs.map(d=>({id:d.id,...d.data()}));render();msg('接続済み')});watch(itemsRef(),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render();msg('接続済み')});render()}
$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('addBtn').onclick=()=>addModal();$('voiceBtn').onclick=()=>{addModal();alert('商品名欄でiPhoneキーボードのマイクを使ってね')};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});onAuthStateChanged(auth,async user=>{clean();uid=user?.uid||null;if(!uid){msg('認証中…');try{await signInAnonymously(auth)}catch(e){msg('認証失敗');alert(e.message)}return}try{await start()}catch(e){msg('読み込み失敗');alert(e.message)}});
</script></body></html>
