<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f2"><meta name="apple-mobile-web-app-capable" content="yes"><title>FutariShopping</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#203957;background:#faf8f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:78px;padding:22px 20px 14px;border-bottom:1px solid #e6e1d7;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0;letter-spacing:.05em}main{max-width:680px;margin:auto;padding:20px 17px 190px}.sub{color:#737985;font-size:13px}.chips{display:flex;gap:9px;overflow:auto;padding:8px 0 16px}.chip{white-space:nowrap;border:1.5px solid #9b9a91;background:white;color:#203957;padding:11px 17px;border-radius:30px}.chip.active{border-color:#203957;background:#203957;color:white}.section{font-size:13px;color:#747984;margin:16px 0 4px}.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e9e5dc;border-radius:14px;margin:9px 0;padding:13px}.item input{width:21px;height:21px;accent-color:#c65430}.item .name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}.done{text-decoration:line-through;opacity:.45}.tiny{font-size:12px;color:#81858c;margin-top:4px}.delete{background:none;border:0;color:#92949a;font-size:20px;padding:6px}.empty{min-height:42vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px}.empty .apple{font-size:60px;color:#203957}.empty strong{font-size:19px}.empty p{font-size:13px;color:#777d87;line-height:1.7;margin:0}.actions{position:fixed;bottom:86px;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:10px 15px;background:linear-gradient(transparent,#faf8f2 25%)}.action{border:2px solid #c65430;background:white;color:#c65430;border-radius:50px;padding:15px 18px;font-weight:700}.action.primary{background:#c65430;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4ddd2;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#78808b;padding:11px 3px 15px;font-size:12px}.nav button.active{color:#203957;font-weight:700}.nav .symbol{display:block;font-size:24px;margin-bottom:4px}.panel{background:#fff;border:1px solid #e8e1d7;border-radius:16px;padding:16px;margin-top:14px}.field{width:100%;border:1.5px solid #c7c5c0;border-radius:13px;padding:14px;margin:9px 0;color:#203957;background:white}.wide{width:100%;background:#c65430;color:#fff;border:0;border-radius:15px;padding:15px;font-weight:700;margin-top:9px}.outline{background:white;color:#203957;border:1px solid #9a9a91;border-radius:13px;padding:10px 14px}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1;min-width:0}.notice{padding:11px;background:#fff0e9;border-radius:10px;color:#8b482f;font-size:13px;margin:12px 0}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:100%;max-width:680px;max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 15px}.hidden{display:none!important}.pill{display:inline-block;background:#f8e8e2;padding:6px 12px;border-radius:20px;font-size:12px}.shopline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.shopline span{flex:1}#status{font-size:12px;color:#8b654b;min-height:16px}button:disabled{opacity:.45}
</style></head><body><header><h1 id="heading">買い物リスト</h1><span id="status">接続中…</span></header><main><div id="content"></div></main><div class="actions" id="actions"><button class="action" id="voiceBtn">🎙 話して追加</button><button class="action primary" id="addBtn">✎ 入力して追加</button></div><nav class="nav"><button data-tab="regular"><span class="symbol">⇄</span>定期購入品</button><button data-tab="list" class="active"><span class="symbol">▤</span>買い物リスト</button><button data-tab="profile"><span class="symbol">♙</span>マイページ</button></nav><div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInAnonymously,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyC2hJ4XrL80cW44Fe1Af5PiccARExSmm1c',authDomain:'futarishopping.firebaseapp.com',projectId:'futarishopping',storageBucket:'futarishopping.firebasestorage.app',messagingSenderId:'853354194520',appId:'1:853354194520:web:aa0e48c226a05e21dd4c2d'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let uid=null,shops=[],items=[],tab='list',selected='すべて',unsubs=[],busy=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=s=>{$('status').textContent=s;};const shopsRef=()=>collection(db,'users',uid,'shops'),itemsRef=()=>collection(db,'users',uid,'items');const defaults=['Amazon','スーパー','薬局','コーナン'];
function open(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('heading').textContent={list:'買い物リスト',regular:'定期購入品',profile:'マイページ'}[tab];$('actions').classList.toggle('hidden',tab!=='list');if(tab==='profile'){ $('content').innerHTML=`<div class="panel"><h3>FutariShopping</h3><p>1人用テスト版</p><p class="sub">匿名ログインで、このブラウザ専用の買い物データを保存します。</p><p class="sub">ユーザーID：<span style="overflow-wrap:anywhere">${esc(uid||'接続中')}</span></p><p class="notice">Safariの履歴・Webサイトデータを削除すると、匿名ユーザーIDが変わり、以前のリストにアクセスできなくなる場合があります。</p></div><div class="panel"><h3>購入先の管理</h3><button class="wide" id="manageShops">購入先を追加・編集</button></div>`;$('manageShops').onclick=shopModal;return}if(tab==='regular'){let list=items.filter(x=>x.regular);$('content').innerHTML=`<p class="sub">よく買うものを登録して、買い物リストに追加できます。</p><button class="wide" id="addRegular">＋ 定期購入品を登録</button>${list.length?list.map(x=>`<div class="item"><div class="name">${esc(x.name)}<div class="tiny">${esc(x.shop||'未設定')} · ${x.cycle?esc(x.cycle)+'日周期':'周期未設定'}</div></div><button class="outline" data-to-list="${x.id}">リストへ</button><button class="delete" data-del="${x.id}">×</button></div>`).join(''):'<div class="empty"><strong>定期購入品はまだありません</strong></div>'}`;$('addRegular').onclick=()=>addModal(true);bindItems();return}let shown=items.filter(x=>!x.regular&&(selected==='すべて'||x.shop===selected));let shopNames=[...new Set([...defaults,...shops.map(s=>s.name)])];$('content').innerHTML=`<div class="section">購入先</div><div class="chips">${['すべて',...shopNames].map(s=>`<button class="chip ${selected===s?'active':''}" data-filter="${esc(s)}">${esc(s)}</button>`).join('')}</div>${shown.length?shown.map(x=>`<div class="item"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><div class="name ${x.done?'done':''}">${esc(x.name)}<div class="tiny">${esc(x.shop||'未設定')}${x.memo?' · '+esc(x.memo):''}</div></div><button class="delete" data-del="${x.id}">×</button></div>`).join(''):'<div class="empty"><div class="apple">♧</div><strong>今回買う物を入れましょう</strong><p>「入力して追加」から商品を登録できます。<br>定期購入品からの追加もできます。</p></div>'}`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{selected=b.dataset.filter;render()});bindItems()}
function bindItems(){document.querySelectorAll('[data-check]').forEach(el=>el.onchange=async()=>{try{await updateDoc(doc(itemsRef(),el.dataset.check),{done:el.checked,updatedAt:serverTimestamp()})}catch(e){alert('更新失敗：'+e.message)}});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{if(confirm('この商品を削除しますか？'))try{await deleteDoc(doc(itemsRef(),el.dataset.del))}catch(e){alert(e.message)}});document.querySelectorAll('[data-to-list]').forEach(el=>el.onclick=async()=>{let x=items.find(i=>i.id===el.dataset.toList);if(!x)return;try{await addDoc(itemsRef(),{name:x.name,shop:x.shop||'未設定',memo:'',done:false,regular:false,createdAt:serverTimestamp()});tab='list';render()}catch(e){alert(e.message)}})}
function addModal(regular=false){let shopNames=[...new Set([...defaults,...shops.map(s=>s.name)])];open(`<div class="row"><h2>${regular?'定期購入品を登録':'入力して追加'}</h2><button class="outline" id="closeModal">閉じる</button></div><label>購入先</label><select class="field" id="newShop">${['未設定',...shopNames].map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="outline" id="shopManage">＋ 購入先を追加</button><label style="display:block;margin-top:15px">商品名</label><input class="field" id="newName" placeholder="例：牛乳" maxlength="100"><label>メモ（任意）</label><input class="field" id="newMemo" placeholder="例：2本" maxlength="200">${regular?'<label>購入周期（日・任意）</label><input class="field" type="number" id="newCycle" min="1" max="3650" placeholder="例：7">':''}<button class="wide" id="saveItem">追加する</button>`);$('closeModal').onclick=close;$('shopManage').onclick=()=>shopModal(true,regular);$('saveItem').onclick=async()=>{let name=$('newName').value.trim(),shop=$('newShop').value,memo=$('newMemo').value.trim();if(!name)return alert('商品名を入力してね');if(busy)return;busy=true;$('saveItem').disabled=true;try{let cycle=regular?Number($('newCycle').value)||null:null;await addDoc(itemsRef(),{name,shop,memo,done:false,regular,cycle,createdAt:serverTimestamp()});close()}catch(e){alert('保存できませんでした：'+e.message)}finally{busy=false}}}
function shopModal(fromAdd=false,regular=false){let names=[...new Set([...defaults,...shops.map(s=>s.name)])];open(`<div class="row"><h2>購入先を管理</h2><button class="outline" id="closeModal">閉じる</button></div><div class="row"><input class="field" id="shopInput" maxlength="40" placeholder="例：業務スーパー"><button class="outline" id="saveShop">追加</button></div><div class="sub">初期の購入先は削除できません。追加した購入先は名前変更・削除できます。</div><div id="shopList">${names.map(s=>{let custom=shops.find(x=>x.name===s);return `<div class="shopline"><span>${esc(s)}</span>${custom?`<button class="outline" data-rename="${custom.id}">変更</button><button class="delete" data-shop-del="${custom.id}">×</button>`:'<span class="pill">初期設定</span>'}</div>`}).join('')}</div>`);$('closeModal').onclick=()=>{close();if(fromAdd)addModal(regular)};$('saveShop').onclick=async()=>{let name=$('shopInput').value.trim();if(!name||names.includes(name))return alert('未入力、または登録済みの購入先です');try{await addDoc(shopsRef(),{name,createdAt:serverTimestamp()});shopModal(fromAdd,regular)}catch(e){alert(e.message)}};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let s=shops.find(x=>x.id===b.dataset.rename);let name=prompt('新しい購入先の名前',s.name)?.trim();if(!name||names.includes(name))return;try{await updateDoc(doc(shopsRef(),s.id),{name});shopModal(fromAdd,regular)}catch(e){alert(e.message)}});document.querySelectorAll('[data-shop-del]').forEach(b=>b.onclick=async()=>{if(!confirm('購入先を削除しますか？既存の商品に記録された購入先名は残ります。'))return;try{await deleteDoc(doc(shopsRef(),b.dataset.shopDel));shopModal(fromAdd,regular)}catch(e){alert(e.message)}})}
$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('addBtn').onclick=()=>addModal();$('voiceBtn').onclick=()=>{addModal();alert('音声入力は商品名欄をタップしてiPhoneキーボードのマイクから使えます。')};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});onAuthStateChanged(auth,user=>{unsubs.forEach(fn=>fn());unsubs=[];uid=user?.uid||null;if(!uid){msg('認証中…');return}msg('保存・同期中');unsubs.push(onSnapshot(shopsRef(),snap=>{shops=snap.docs.map(d=>({id:d.id,...d.data()}));render();msg('接続済み')},e=>msg('購入先エラー：'+e.code)));unsubs.push(onSnapshot(itemsRef(),snap=>{items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));render();msg('接続済み')},e=>msg('商品エラー：'+e.code)));render()});signInAnonymously(auth).catch(e=>{msg('認証失敗');alert('匿名ログインできません：'+e.message+'\nFirebaseの匿名認証と承認済みドメインを確認してください。')});
</script></body></html>
